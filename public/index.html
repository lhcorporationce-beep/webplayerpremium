<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/favicon.png">
<title>IPTV PREMIUM</title>
<script src="/vendor/hls.min.js"></script>
<script src="/vendor/mpegts.js"></script>
<script src="/vendor/shaka.js"></script>
<script src="/i18n.js"></script>
<style>
:root{--bg:#000;--card:#0f0f0f;--card2:#1a1a1a;--txt:#fff;--mut:#9a9a9a;--acc:#00ff40;--accd:#22c20c;--gold:#00ff40;--line:#1f2a1f;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--card2);padding:10px 14px;border-radius:10px}
button:focus-visible,input:focus-visible,.card:focus-visible,.ch:focus-visible,.cat:focus-visible{outline:2px solid var(--gold)}
button.pri{background:var(--acc);color:#000;font-weight:700;box-shadow:0 0 14px #00ff4055}
button.pri:hover{background:#4dff74}
input,select{background:var(--card);border:1px solid #2a2a2a;border-radius:10px;padding:12px;width:100%}
.hide{display:none!important}
/* login */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% -10%,#0c3a0a 0,transparent 55%),var(--bg)}
.box{width:100%;max-width:420px;background:var(--card);padding:26px;border-radius:18px;display:grid;gap:12px;border:1px solid var(--line);box-shadow:0 0 40px #00ff4014}
.logo{font-size:26px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:10px;line-height:1}.logo b{color:var(--acc);text-shadow:0 0 12px #00ff4066}.logo img{height:1.9em;width:auto;flex:none}.biglogo{display:block;width:100%;max-width:230px;margin:0 auto -4px;border-radius:12px}.logo .tx{display:flex;flex-direction:column;gap:2px}.logo .tx i{font-style:normal;color:#fff}.logo .tx b{font-size:.55em;letter-spacing:.32em}
.tabs2{display:flex;gap:6px}.tabs2 button{flex:1}.tabs2 .on{background:var(--acc);color:#000;font-weight:700}
.err{color:#ff6b6b;font-size:14px;min-height:18px}
small,.mut{color:var(--mut)}
/* app */
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#050505;border-bottom:1px solid var(--line)}
#fsbtn{display:none}nav button{padding:9px 10px}nav button .ic{margin-right:5px}
@media(max-width:1250px) and (min-width:721px){#q{max-width:110px!important}nav button{padding:9px 7px}nav button .ic{margin-right:3px}}
@media(max-width:720px){#helpbtn{display:none}header{gap:6px}#q{width:110px!important}header .logo .tx{font-size:15px}}
@media(max-width:720px){nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 4px}nav button .ic{margin:0;font-size:17px}}
#helpbtn{font-weight:700;min-width:38px}
.qt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.qt button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;font-size:14px}
.qt button span{font-size:26px}.qt button small{color:var(--mut);font-size:11px}.qt button:hover{border-color:var(--acc)}
.stabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}.stabs button{padding:7px 11px;font-size:13px;border-radius:999px;background:#ffffff1c}.stabs button.on{background:var(--acc);color:#000;font-weight:700}
.tour{text-align:center}.tour .big{font-size:46px}.tour h3{margin:6px 0}.tour p{color:var(--mut);margin:6px 0 14px}.tour .dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.tour .dots i{width:8px;height:8px;border-radius:50%;background:#ffffff33}.tour .dots i.on{background:var(--acc)}.tour .tb{display:flex;gap:8px;justify-content:center}
header .logo{font-size:20px;white-space:nowrap}header .logo img{height:44px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav button{background:transparent;white-space:nowrap;color:var(--mut)}
nav button.on{color:var(--acc);background:var(--card2);box-shadow:inset 0 -2px var(--acc)}
#q{max-width:220px;padding:9px 12px}
main{flex:1;display:flex;min-height:0}
aside{width:230px;overflow-y:auto;border-right:1px solid var(--line);padding:8px;background:#050505}
.cat{display:block;width:100%;text-align:left;background:transparent;padding:9px 10px;border-radius:8px;color:var(--mut);font-size:14px}
.cat.on{background:var(--card2);color:var(--acc);box-shadow:inset 3px 0 var(--acc)}
section{flex:1;overflow-y:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s;border:1px solid #1a1a1a}
.card:hover,.card:focus-visible{transform:scale(1.04);box-shadow:0 0 18px #00ff4055;border-color:var(--acc)}
.card .img{aspect-ratio:2/3;background:#222 center/cover no-repeat}
.card .t{padding:8px;font-size:13px;line-height:1.25;height:50px;overflow:hidden}
.card .star{position:absolute;top:6px;right:6px;background:#000a;border-radius:50%;width:30px;height:30px;padding:0;display:grid;place-items:center}
.card .pg{position:absolute;left:0;bottom:50px;height:3px;background:var(--acc);box-shadow:0 0 6px var(--acc)}
.list{display:grid;gap:6px}
.ch{display:flex;align-items:center;gap:12px;background:var(--card);padding:8px 12px;border-radius:10px;cursor:pointer}
.ch:hover{background:var(--card2)}
.ch{border:1px solid #161616}.ch:hover,.ch:focus-visible{border-color:var(--acc)}
.ch .lg{width:44px;height:44px;border-radius:8px;background:#222 center/contain no-repeat;flex:none}
.ch .in{flex:1;min-width:0}.ch .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .ep{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .star{background:transparent;padding:6px}
h3{margin:18px 0 10px}
/* modal / player */
.ov{position:fixed;inset:0;background:#000d;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.mod{border:1px solid var(--line);background:var(--card);border-radius:16px;max-width:760px;width:100%;max-height:92vh;overflow-y:auto;padding:18px}
.det{display:flex;gap:16px;flex-wrap:wrap}.det img{width:150px;border-radius:10px;object-fit:cover;align-self:flex-start}
.det .tx{flex:1;min-width:220px}
.eps{display:grid;gap:6px;margin-top:10px}.eps button{text-align:left}
#player{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
#player video{flex:1;width:100%;min-height:0;background:#000;margin-bottom:64px}#player.idle video{margin-bottom:0}
#player.tc video{margin-bottom:108px}#player.tc.idle video{margin-bottom:0}
#tcbar{position:absolute;left:0;right:0;bottom:64px;display:flex;align-items:center;gap:10px;padding:6px 16px;background:#000b;font-size:13px;z-index:3;transition:opacity .25s}
#tcbar input{flex:1;accent-color:#00ff40;height:6px}
#player.idle #tcbar{opacity:0;pointer-events:none}
video::-webkit-media-controls-panel{background-image:linear-gradient(transparent,#000d)}
video::-webkit-media-controls-timeline{filter:hue-rotate(-80deg) saturate(2.2) brightness(1.1)}
video::-webkit-media-controls-volume-slider{filter:hue-rotate(-80deg) saturate(2.2) brightness(1.1)}
.pbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#000c;position:absolute;bottom:0;left:0;right:0;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:3}
.pbar .ti{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pbar button{background:#ffffff22}.pbar button:hover{background:var(--acc);color:#000}
#perr{position:absolute;bottom:20%;left:0;right:0;text-align:center;padding:0 20px;color:#ffb3b3}
video{accent-color:#00ff40}
#ptoast{position:absolute;top:24px;left:50%;transform:translateX(-50%);background:#000c;border:1px solid var(--acc);color:var(--acc);padding:8px 16px;border-radius:20px;z-index:3;font-weight:600}
video::-webkit-media-controls-fullscreen-button{display:none}
#plist,#pepg,#pset{position:absolute;right:0;top:0;bottom:64px;width:min(360px,88vw);background:#000e;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding:10px;z-index:2;backdrop-filter:blur(6px)}
#plist select,#plist input{padding:9px}
#pepg,#pset{overflow-y:auto;display:block}
#psub{font-size:12px;font-weight:400;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
#pitems{overflow-y:auto;flex:1;display:grid;gap:5px;align-content:start}
.pit{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:9px;background:var(--card);cursor:pointer;font-size:14px;border:1px solid #161616}
.pit:hover,.pit:focus-visible{border-color:var(--acc)}.pit.on{background:#0c2a12;border-color:var(--acc);color:var(--acc)}
.pit .lg{width:34px;height:34px;border-radius:6px;background:#222 center/contain no-repeat;flex:none}.pit span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pmore{width:100%}
.gr{background:var(--card);border:1px solid #161616;border-radius:10px;overflow:hidden}
.gr:hover{border-color:var(--line)}
.gh{display:flex;align-items:center;gap:12px;padding:8px 12px;cursor:pointer}
.gh .lg{width:44px;height:44px;border-radius:8px;background:#222 center/contain no-repeat;flex:none}
.gh .in{flex:1;min-width:0}
.gnow{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnext{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar{height:3px;background:#222;border-radius:2px;margin:4px 0}.gbar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.gplay{background:var(--acc);color:#000;font-weight:700;padding:8px 12px}
.gfull{padding:6px 12px 10px;border-top:1px solid #161616}
.pday{font-size:12px;color:var(--mut);padding:8px 0 2px;text-transform:uppercase;letter-spacing:.05em}
.pgi{display:flex;gap:10px;padding:5px 0;font-size:13px}.pgi b{min-width:44px;color:var(--mut)}.pgi.now,.pgi.now b{color:var(--acc)}.pgi.past{opacity:.45}
.pgi small{display:block;color:var(--mut);font-size:12px;max-height:2.6em;overflow:hidden}
.profs{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.prof{width:96px;text-align:center;cursor:pointer}
.prof .av{width:96px;height:96px;border-radius:14px;display:grid;place-items:center;font-size:40px;font-weight:800;margin-bottom:6px;color:#000;border:2px solid transparent}.prof:hover .av{border-color:#fff}
.empty{color:var(--mut);padding:40px;text-align:center}
.spin{padding:30px;text-align:center;color:var(--mut)}
@media(max-width:1000px){#q{max-width:105px}nav button{padding:10px 8px}}
@media(max-width:720px){aside{display:none}header{flex-wrap:wrap}header .logo{flex:1}#q{max-width:none;width:150px;flex:none}nav{order:3;flex:1 1 100%}nav button{flex:1;padding:9px 10px}.catsel{display:block!important}section{padding:10px}}
.catsel{display:none;margin-bottom:12px}

/* barra de rolagem: fundo preto + barra verde */
html{scrollbar-color:#00ff40 #000}
::-webkit-scrollbar{width:12px;height:12px;background:#000}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#00ff40;border-radius:8px;border:2px solid #000;min-height:40px}
::-webkit-scrollbar-thumb:hover{background:#4dff74}
::-webkit-scrollbar-corner{background:#000}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:#00ff40 #000}}
/* início (estilo streaming) */
.hero{position:relative;border-radius:16px;overflow:hidden;min-height:210px;display:flex;align-items:flex-end;gap:16px;padding:20px;margin-bottom:6px;background:#0a0a0a;border:1px solid var(--line)}
.hero .hb{position:absolute;inset:-24px;background:center/cover;filter:blur(22px) brightness(.45)}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#000d 5%,#0000 75%)}
.hero>*:not(.hb){position:relative;z-index:1}
.hero .ht{flex:1;min-width:0}.hero h2{margin:4px 0 6px;font-size:26px;text-shadow:0 2px 10px #000}
.hero .hp{height:190px;aspect-ratio:2/3;border-radius:10px;background:#222 center/cover;box-shadow:0 8px 30px #000;flex:none;order:2;margin-left:auto}
.hero .hbtn{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.rowh{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 6px}.rowh h3{margin:0}
.rowh button{background:transparent;color:var(--acc);padding:4px 8px}
.row{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
.row .card{width:132px;flex:none;scroll-snap-align:start}
.dback{display:none;height:160px;margin:-18px -18px 14px;background:#111 center/cover;position:relative}
.dback:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,var(--card),transparent)}
.dmeta{color:var(--mut);margin:4px 0;font-size:14px}.dcast{font-size:13px;color:var(--mut);margin:6px 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
/* player */
.pbar{overflow-x:auto;transition:opacity .25s}.pbar button{white-space:nowrap}
.pbar{gap:8px}.pbar button{height:40px;min-width:40px;padding:0 12px;border-radius:10px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pbar #pclose{margin-right:4px;background:#ffffff33}
.pbar .pg{display:flex;align-items:center;gap:6px;padding-left:10px;margin-left:2px;border-left:1px solid #ffffff2e;flex:none}
.pbar .pg:not(:has(button:not(.hide))){display:none}
.pbar .ti{margin-right:6px}
@media(max-width:760px){.pbar .lbl{display:none}.pbar button{padding:0 9px}}
#player.idle{cursor:none}#player.idle .pbar{opacity:0;pointer-events:none}
.cfg h3{margin:0 0 4px}.cfg .sec{margin:16px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.cfg .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;margin:4px 0;background:var(--card2);border-radius:10px}
.cfg .row label{flex:1}.cfg .row small{display:block;color:var(--mut);font-size:12px}
.cfg select{background:#000;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;max-width:55%}
.cfg .sw{width:46px;height:26px;border-radius:13px;background:#333;position:relative;flex:none;padding:0}
.cfg .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.cfg .sw.on{background:var(--acc)}.cfg .sw.on::after{left:23px;background:#000}
.pin{font-size:28px;letter-spacing:.5em;text-align:center;width:100%;background:#000;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.sh{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 4px}
.opt{display:block;width:100%;text-align:left;margin:3px 0;background:var(--card2)}
.opt.on{background:#0c2a12;color:var(--acc);box-shadow:inset 3px 0 var(--acc)}
/* modo TV */
body.tv :focus-visible{outline:4px solid #fff!important;outline-offset:3px;box-shadow:0 0 0 7px var(--acc)}
body.tv .card:focus-visible{transform:scale(1.08);z-index:2}
body.tv .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
body.tv .row .card{width:170px}
body.tv button,body.tv select,body.tv input{padding:14px 18px;font-size:18px}
body.tv aside{width:280px}body.tv .cat{font-size:17px;padding:12px}
body.tv .ch,body.tv .gh{padding:12px 16px}
@media(max-width:720px){.lbl{display:none}.hero .hp{display:none}.hero h2{font-size:21px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hide">
 <div class="box">
  <img class="biglogo" src="/logo.png" alt="IPTV PREMIUM">
  <div><b style="font-size:18px">Configuração inicial</b><br><small>Informe os dados do seu acesso. Isso é feito só uma vez neste aparelho.</small></div>
  <div class="tabs2"><button id="tX" class="on">Xtream Codes</button><button id="tM">Lista M3U</button></div>
  <div id="fX" style="display:grid;gap:10px">
   <select id="srvsel" class="hide"></select>
   <input id="srv" placeholder="Servidor (ex: http://servidor.com:8080)" autocapitalize="off" autocorrect="off">
   <input id="usr" placeholder="Usuário" autocapitalize="off" autocorrect="off" autocomplete="username">
   <input id="pwd" type="password" placeholder="Senha" autocomplete="current-password">
  </div>
  <div id="fM" class="hide" style="display:grid;gap:10px">
   <input id="m3u" placeholder="URL da lista M3U" autocapitalize="off" autocorrect="off">
   <input id="m3uf" type="file" accept=".m3u,.m3u8,.txt">
  </div>
  <div class="err" id="lerr"></div>
  <button class="pri" id="go">Salvar e entrar</button>
 </div>
</div>

<!-- PERFIS -->
<div id="profScreen" class="hide" style="min-height:100%;display:none;align-items:center;justify-content:center;flex-direction:column;gap:24px;padding:20px">
 <img class="biglogo" src="/logo.png" alt="IPTV PREMIUM" style="max-width:170px"><div class="logo" style="font-size:24px"><span><i style="font-style:normal">Quem está </i><b>assistindo?</b></span></div>
 <div class="profs" id="profs"></div>
 <button id="logout">Trocar conta</button>
</div>

<!-- APP -->
<div id="app" class="hide">
 <header>
  <div class="logo"><img src="/icon.png" alt="IPTV Premium" title="IPTV Premium"></div>
  <nav id="nav">
   <button data-t="home" class="on" title="Tela inicial com novidades"><span class="ic">🏠</span><span class="nl">Início</span></button>
   <button data-t="live" title="Canais ao vivo"><span class="ic">📺</span><span class="nl">Ao vivo</span></button>
   <button data-t="movie" title="Todos os filmes"><span class="ic">🎬</span><span class="nl">Filmes</span></button>
   <button data-t="series" title="Todas as séries"><span class="ic">🍿</span><span class="nl">Séries</span></button>
   <button data-t="guide" title="Programação dos canais"><span class="ic">📅</span><span class="nl">Guia</span></button>
  </nav>
  <input id="q" type="search" placeholder="Buscar…" title="Buscar canais, filmes e séries">
  <button id="fsbtn" title="Tela cheia (F11)">⛶</button>
  <button id="helpbtn" title="Como usar (tour rápido)">?</button>
  <button id="cfgbtn" title="Configurações">⚙</button>
  <button id="pbtn" title="Perfil">👤</button>
 </header>
 <main>
  <aside id="cats"></aside>
  <section id="content"></section>
 </main>
</div>

<div id="modal" class="ov hide"><div class="mod" id="mbody"></div></div>

<div id="player" class="hide">
 <video id="vid" controls controlsList="nofullscreen" autoplay playsinline></video>
 <div class="pbar"><button id="pclose" title="Fechar (Esc)">✕</button><div class="ti"><div id="ptitle"></div><div id="psub"></div></div><div class="pg"><button id="pprev" class="hide" title="Canal anterior">◀</button><button id="pnext" class="hide">Próximo ▶</button><button id="pb10" class="hide" title="Voltar 10s">⏪ 10</button><button id="pf10" class="hide" title="Avançar 10s">10 ⏩</button></div><div class="pg"><button id="pgbtn" class="hide" title="Programação (G)">📅<span class="lbl"> Programação</span></button><button id="pfav" title="Favoritar (D)">☆</button><button id="plbtn" title="Lista (L)">☰<span class="lbl"> Lista</span></button></div><div class="pg"><button id="ppip" class="hide" title="Janela flutuante">⧉</button><button id="pfit" title="Formato da imagem (A)">▭</button><button id="psbtn" title="Ajustes (S)">⚙</button></div></div>
 <div id="pepg" class="hide"></div>
 <div id="pset" class="hide"></div><input id="subf" type="file" accept=".srt,.vtt,.txt" class="hide">
 <div id="plist" class="hide"><select id="pcat"></select><input id="pq" type="search" placeholder="Buscar nesta lista…"><div id="pitems"></div></div>
 <div id="tcbar" class="hide"><span id="tcc">0:00</span><input id="tcr" type="range" min="0" max="100" value="0" step="1"><span id="tcd">0:00</span></div>
 <div id="perr"></div>
 <div id="ptoast" class="hide"></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

    if(r.status===502)throw new Error('Não foi possível conectar ao servidor IPTV. Confira o endereço e a porta.');
    throw new Error('HTTP '+r.status+(m&&!/^</.test(m)?' - '+m:''))}
  const t=await r.text();
  try{return JSON.parse(t)}catch{
    throw new Error(/^\s*</.test(t)?'O servidor respondeu uma página da web em vez de dados. Confira a URL e a porta, ou se o servidor bloqueia este site.'+((t.match(/<title[^>]*>([^<]{1,80})/i)||[])[1]?' (Página recebida: '+t.match(/<title[^>]*>([^<]{1,80})/i)[1].trim()+')':''):'Resposta inválida do servidor IPTV.')}
}

const I18N_ORIG=new WeakMap(), I18N_ATTR=new WeakMap(), I18N_ATTRS=['placeholder','title','aria-label'];
function tr(s){
  if(LANG==='pt'||!s||!window.I18N)return s;
  const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s);if(!m||!m[2])return s;
  const d=window.I18N[LANG]||{};let t=d[m[2]];
  if(t==null){for(const [re,f] of (window.I18N_RULES||[])){const r=re.exec(m[2]);if(r){t=f(r,LANG,d);break}}}
  return t==null?s:m[1]+t+m[3];
}
function i18nText(n){
  const cur=n.nodeValue;let rec=I18N_ORIG.get(n);
  if(rec&&rec.t===cur){return}
  rec={o:cur};rec.t=tr(cur);I18N_ORIG.set(n,rec);if(rec.t!==cur)n.nodeValue=rec.t;
}
function i18nAttr(el,a){
  let m=I18N_ATTR.get(el);if(!m){m={};I18N_ATTR.set(el,m)}
  const cur=el.getAttribute(a);if(cur==null)return;const rec=m[a];
  if(rec&&rec.t===cur)return;
  const t=tr(cur);m[a]={o:cur,t};if(t!==cur)el.setAttribute(a,t);
}
function i18nWalk(root){
  if(root.nodeType===3){if(root.parentNode&&!/^(SCRIPT|STYLE)$/.test(root.parentNode.nodeName))i18nText(root);return}
  if(root.nodeType!==1||/^(SCRIPT|STYLE)$/.test(root.nodeName))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);let n=w.currentNode;
  const each=n=>{if(n.nodeType===3){if(!/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName))i18nText(n)}else for(const a of I18N_ATTRS)if(n.hasAttribute&&n.hasAttribute(a))i18nAttr(n,a)};
  each(root);while((n=w.nextNode()))each(n);
}
function i18nRestore(){
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){
    if(n.nodeType===3){const r=I18N_ORIG.get(n);if(r&&r.t===n.nodeValue){n.nodeValue=r.o;I18N_ORIG.delete(n)}}
    else{const m=I18N_ATTR.get(n);if(m)for(const a in m){if(n.getAttribute(a)===m[a].t)n.setAttribute(a,m[a].o)}I18N_ATTR.delete(n)}
  }
}
let i18nMO=null;
function setLang(l,quiet){
  const prev=LANG;LANG=l;LS.set('lang',l);document.documentElement.lang=LOC();
  if(i18nMO){i18nMO.disconnect();i18nMO=null}
  if(prev!=='pt')i18nRestore();
  document.title=LANG==='pt'?'IPTV PREMIUM':'IPTV PREMIUM';
  if(l!=='pt'){
    i18nWalk(document.body);
    i18nMO=new MutationObserver(ms=>{
      i18nMO.disconnect();
      try{for(const m of ms){
        if(m.type==='characterData'){if(m.target.parentNode)i18nWalk(m.target)}
        else if(m.type==='attributes'){if(I18N_ATTRS.includes(m.attributeName))i18nAttr(m.target,m.attributeName)}
        else m.addedNodes.forEach(n=>i18nWalk(n))}}finally{i18nMO.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:I18N_ATTRS})}
    });
    i18nMO.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:I18N_ATTRS});
  }
  if(!quiet&&loaded)render();
}

function pcHash(pin){let a=0xdeadbeef,b=0x41c6ce57;const t='iptvp|'+pin+'|premium';for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return (4294967296*(2097151&b)+(a>>>0)).toString(36)}

function pcApply(){

  HID={live:new Set(),movie:new Set(),series:new Set()};

function askPin(msg,opts={}){
  return new Promise(res=>{
    const confirm2=opts.confirm;
    showModal(`<div class="cfg"><h3>${esc(msg)}</h3><input class="pin" id="pin1" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">${confirm2?'<div class="mut" style="margin-top:8px">Repita a senha</div><input class="pin" id="pin2" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">':''}<div id="pinerr" class="mut" style="color:#ff6b6b;min-height:20px"></div><div class="btns"><button class="pri" id="pinok">OK</button><button id="pincx">Cancelar</button></div></div>`);
    const i1=$('#pin1');i1.focus();

    const go=()=>{
      const a=i1.value;
      if(!/^\d{4}$/.test(a)){$('#pinerr').textContent='Use 4 números.';return}
      if(confirm2){if($('#pin2').value!==a){$('#pinerr').textContent='As senhas não conferem.';return}return done(a)}
      if(opts.check){if(pcHash(a)!==PC.h){$('#pinerr').textContent='Senha incorreta.';i1.value='';i1.focus();return}}
      done(a);
    };
    $('#pinok').onclick=go;$('#pincx').onclick=()=>done(null);
    $$('.pin').forEach(i=>i.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')go();if(e.key==='Escape')done(null)});
  });
}

const CACHE_MS=6*3600*1000, A=x=>Array.isArray(x)?x:[];

async function loadAllRaw(force){
  if(acc.mode==='x'){
    const ck='cat_'+acckey();const old=await IDB.get(ck);
    if(old&&old.D&&!force&&Date.now()-old.t<CACHE_MS){D=old.D;D.t=old.t;return}
    const b=`${acc.server}/player_api.php?username=${encodeURIComponent(acc.user)}&password=${encodeURIComponent(acc.pass)}&action=`;
    const [lc,ls,vc,vs,sc,ss]=(await Promise.all(['get_live_categories','get_live_streams','get_vod_categories','get_vod_streams','get_series_categories','get_series'].map(a=>jget(b+a).catch(()=>[])))).map(A);
    if(!ls.length&&!vs.length&&!ss.length){
      if(old&&old.D){D=old.D;D.t=old.t;return}
      throw new Error('Nenhum conteúdo retornado pelo servidor');
    }
    const cm=a=>Object.fromEntries(a.map(c=>[c.category_id,c.category_name]));
    const L=cm(lc),V=cm(vc),S=cm(sc);
    const nd={live:[],movie:[],series:[],cats:{live:lc,movie:vc,series:sc},t:Date.now()};

    nd.movie=vs.map(x=>({id:x.stream_id,name:x.name,img:x.stream_icon,cat:String(x.category_id),catName:V[x.category_id],ext:x.container_extension||'mp4',rating:x.rating,added:+x.added||0,type:'movie'}));

function parseM3U(t){
  const L=t.split(/\r?\n/);const out={live:[],movie:[],series:[]},cs={live:new Map(),movie:new Map(),series:new Map()};let inf=null,n=0;
  for(const l0 of L){const l=l0.trim();
    if(l.startsWith('#EXTINF')){const a=k=>(l.match(new RegExp(k+'="([^"]*)"'))||[])[1]||'';inf={name:l.split(',').pop().trim()||a('tvg-name'),img:a('tvg-logo'),grp:a('group-title')||'Outros',epg:a('tvg-id')}}
    else if(l&&!l.startsWith('#')&&inf){
      const type=/\/series\//i.test(l)?'series':/\/movie\//i.test(l)||/\.(mp4|mkv|avi)(\?|$)/i.test(l)?'movie':'live';
      const id='m'+(n++);cs[type].set(inf.grp,inf.grp);
      out[type].push({id,name:inf.name,img:inf.img,cat:inf.grp,catName:inf.grp,epg:inf.epg,url:l,type:type==='series'?'movie':type});
      inf=null}}
  D.live=out.live;D.movie=out.movie.concat(out.series);D.series=[];
  D.cats={live:[...cs.live.keys()].map(k=>({category_id:k,category_name:k})),movie:[...new Set([...cs.movie.keys(),...cs.series.keys()])].map(k=>({category_id:k,category_name:k})),series:[]};
}

  if(it.type==='live'){open(it);plMark()}
  else if(it.type==='movie'){$('#plist').classList.add('hide');play({it,title:it.name,url:streamUrl(it)})}
  else{closePlayer();open(it)}
}

/* ---------- tela cheia (app inteiro, como F11) ---------- */
const FSE=()=>document.fullscreenElement||document.webkitFullscreenElement;
function toggleFS(){
  const d=document.documentElement;
  if(FSE()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  if(d.requestFullscreen)d.requestFullscreen().catch(()=>{});
  else if(d.webkitRequestFullscreen)d.webkitRequestFullscreen();
  else if(playCtx&&V.webkitEnterFullscreen)V.webkitEnterFullscreen();
}
function fsSync(){const on=!!FSE();[$('#fsbtn')].forEach(b=>{b.textContent=on?'🗗':'⛶';b.title=on?'Sair da tela cheia (Esc)':'Tela cheia (F11)'})}
document.addEventListener('fullscreenchange',fsSync);document.addEventListener('webkitfullscreenchange',fsSync);
$('#fsbtn').onclick=toggleFS;
if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen))$('#fsbtn').classList.add('hide');

/* ---------- Shaka Player ---------- */
async function startShaka(url,ctx,err,h){
  const sp=new shaka.Player();shk=sp;
  try{
    await sp.attach(V);
    sp.configure({streaming:{bufferingGoal:30,retryParameters:{maxAttempts:3}}});
    sp.addEventListener('error',e=>{if(shk===sp)err('Erro no Shaka Player'+(e.detail&&e.detail.code?' ('+e.detail.code+')':'')+'. Tente outro reprodutor em ⚙ Ajustes.')});
    const start=ctx.live?null:(ctx.startAt||(RESUME&&h&&h.pos>30&&h.dur&&h.pos<h.dur*.95?h.pos:null));
    await sp.load(url,start,'application/x-mpegurl');
    if(shk===sp)V.play().catch(()=>{});
  }catch(e){if(shk===sp)err('Não foi possível reproduzir com o Shaka Player. Tente outro reprodutor em ⚙ Ajustes.')}
}
function setEng(v){
  ENG=v;LS.set('eng',v);toast('Reprodutor: '+ENGS.find(e=>e[0]===v)[1]);
  if(playCtx){const c=playCtx;play({...c,startAt:c.live?0:curT()});setTimeout(()=>{if(!$('#pset').classList.contains('hide'))setBuild()},1500)}
}

/* ---------- formato (proporção) da imagem ---------- */
const FITS=[['contain','Original'],['cover','Preencher a tela'],['fill','Esticar'],['16/9','16:9'],['4/3','4:3'],['21/9','21:9']];
let fitMode=LS.get('fit','contain');if(!FITS.some(f=>f[0]===fitMode))fitMode='contain';
function applyFit(m){
  fitMode=m;LS.set('fit',m);
  if(m.includes('/')){
    const [a,b]=m.split('/').map(Number),r=a/b,P=$('#player'),W=P.clientWidth,H=P.clientHeight;
    const w=Math.min(W,H*r);V.style.objectFit='fill';V.style.flex='none';V.style.width=w+'px';V.style.height=(w/r)+'px';V.style.alignSelf='center';
  }else{V.style.objectFit=m;V.style.flex='';V.style.width='';V.style.height='';V.style.alignSelf=''}
}
function toast(t){const e=$('#ptoast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),1600)}
function fitNext(){const i=FITS.findIndex(f=>f[0]===fitMode);const n=FITS[(i+1)%FITS.length];applyFit(n[0]);toast('Imagem: '+n[1]);if(!$('#pset').classList.contains('hide'))setBuild()}
$('#pfit').onclick=fitNext;
addEventListener('resize',()=>{if(fitMode.includes('/'))applyFit(fitMode)});
document.addEventListener('fullscreenchange',()=>setTimeout(()=>{if(fitMode.includes('/'))applyFit(fitMode)},100));

/* ---------- ajustes do player ---------- */
const panelsOpen=()=>['#plist','#pepg','#pset'].some(x=>!$(x).classList.contains('hide'));
function closePanels(){['#plist','#pepg','#pset'].forEach(x=>$(x).classList.add('hide'))}
let setTab='';
function setBuild(){
  const P=$('#pset');if(!playCtx)return;
  const opt=(g,v,l,on)=>`<button class="opt ${on?'on':''}" data-g="${g}" data-v="${esc(v)}">${esc(l)}</button>`;
  let h='<b>Ajustes</b>';
  if(shk){
    try{
      const vt=shk.getVariantTracks(),hs=[...new Set(vt.map(t=>t.height).filter(Boolean))].sort((a,b)=>b-a);
      if(hs.length>1){const auto=shk.getConfiguration().abr.enabled;h+='<div class="sh">Qualidade</div>'+opt('sq','auto','Automática',auto)+hs.map(x=>opt('sq',x,x+'p',!auto&&vt.some(t=>t.active&&t.height===x))).join('')}
      const al=shk.getAudioLanguages();if(al.length>1)h+='<div class="sh">Áudio</div>'+al.map(l=>opt('sa',l,l,vt.some(t=>t.active&&t.language===l))).join('');
      const tl=shk.getTextTracks();if(tl.length)h+='<div class="sh">Legendas</div>'+opt('st','off','Desligadas',!shk.isTextTrackVisible())+tl.map(t=>opt('st',t.id,t.label||t.language||'Legenda',shk.isTextTrackVisible()&&t.active)).join('');
    }catch{}
  }
  if(hls&&hls.levels&&hls.levels.length>1)
    h+='<div class="sh">Qualidade</div>'+opt('q','-1','Automática',hls.autoLevelEnabled)+hls.levels.map((l,i)=>({l,i})).sort((a,b)=>(b.l.height||0)-(a.l.height||0)).map(({l,i})=>opt('q',i,l.height?l.height+'p':Math.round((l.bitrate||0)/1000)+' kbps',!hls.autoLevelEnabled&&hls.currentLevel===i)).join('');
  if(hls&&hls.audioTracks&&hls.audioTracks.length>1)
    h+='<div class="sh">Áudio</div>'+hls.audioTracks.map((t,i)=>opt('a',i,t.name||t.lang||'Faixa '+(i+1),hls.audioTrack===i)).join('');
  const hs=(hls&&hls.subtitleTracks)||[];
  const tt=[...V.textTracks].filter(t=>t.kind==='subtitles'||t.kind==='captions');
  if(hs.length)h+='<div class="sh">Legendas</div>'+opt('s',-1,'Desligadas',hls.subtitleTrack===-1)+hs.map((t,i)=>opt('s',i,t.name||t.lang||'Legenda '+(i+1),hls.subtitleTrack===i)).join('');
  else if(tt.length)h+='<div class="sh">Legendas</div>'+opt('t',-1,'Desligadas',tt.every(t=>t.mode!=='showing'))+tt.map((t,i)=>opt('t',i,t.label||t.language||'Legenda '+(i+1),t.mode==='showing')).join('');
  if(!playCtx.live&&!/>Legendas</.test(h))h+='<div class="sh">Legendas</div>';
  if(!playCtx.live)h+='<button class="opt" data-g="file" style="margin-top:8px">📄 Carregar legenda (.srt/.vtt)</button>';
  if(!playCtx.live)h+='<div class="sh">Velocidade</div>'+[0.5,0.75,1,1.25,1.5,2].map(v=>opt('r',v,v+'x',V.playbackRate===v)).join('');
  h+='<div class="sh">Reprodutor de vídeo</div>'+ENGS.map(([v,l])=>opt('e',v,l,ENG===v)).join('')+'<p class="mut" style="font-size:12px;margin:6px 2px">ExoPlayer existe só no app Android. JW Player exige licença paga.</p>';
  h+='<div class="sh">Formato da imagem</div>'+FITS.map(([v,l])=>opt('f',v,l,fitMode===v)).join('');
  h+='<div class="sh">Tela</div>'+opt('fs','',FSE()?'🗗 Sair da tela cheia':'⛶ Tela cheia',!!FSE());
  {const parts=h.split('<div class="sh">').slice(1).map(x=>{const i=x.indexOf('</div>');return[x.slice(0,i),x.slice(i+6)]});
   const S={},order=[];parts.forEach(([k,v])=>{if(!S[k]){S[k]='';order.push(k)}S[k]+=v});
   const sh={'Reprodutor de vídeo':'Player','Formato da imagem':'Imagem'};
   if(!order.includes(setTab))setTab=order[0];
   h='<b>Ajustes</b><div class="stabs">'+order.map(k=>`<button class="stab ${k===setTab?'on':''}" data-k="${esc(k)}">${esc(sh[k]||k)}</button>`).join('')+'</div>'+(S[setTab]||'');}
  P.innerHTML=h;
}
const P_hide=()=>$('#pset').classList.add('hide');
$('#pset').onclick=e=>{
  const st=e.target.closest('.stab');if(st){setTab=st.dataset.k;setBuild();return}
  const b=e.target.closest('.opt');if(!b)return;const g=b.dataset.g,v=b.dataset.v;
  if(g==='q'&&hls)hls.currentLevel=+v;
  else if(g==='a'&&hls)hls.audioTrack=+v;
  else if(g==='s'&&hls){hls.subtitleDisplay=true;hls.subtitleTrack=+v}
  else if(g==='t'){const tt=[...V.textTracks].filter(t=>t.kind==='subtitles'||t.kind==='captions');tt.forEach((t,i)=>{t.mode=(+v===i)?'showing':'disabled'})}
  else if(g==='sq'&&shk){if(v==='auto')shk.configure({abr:{enabled:true}});else{shk.configure({abr:{enabled:false}});const t=shk.getVariantTracks().filter(t=>t.height===+v).sort((a,b)=>b.bandwidth-a.bandwidth)[0];if(t)shk.selectVariantTrack(t,true)}}
  else if(g==='sa'&&shk)shk.selectAudioLanguage(v);
  else if(g==='st'&&shk){if(v==='off')shk.setTextTrackVisibility(false);else{const t=shk.getTextTracks().find(t=>String(t.id)===v);if(t){shk.selectTextTrack(t);shk.setTextTrackVisibility(true)}}}
  else if(g==='e'){setEng(v);return}
  else if(g==='r')V.playbackRate=+v;
  else if(g==='f')applyFit(v);
  else if(g==='fs'){P_hide();toggleFS();return}
  else if(g==='file'){$('#subf').click();return}
  setBuild();
};
$('#subf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const buf=await f.arrayBuffer();let t;
  try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{t=new TextDecoder('windows-1252').decode(buf)}
  if(!/^﻿?\s*WEBVTT/.test(t))t='WEBVTT\n\n'+t.replace(/\r/g,'').replace(/(\d+:\d+:\d+),(\d+)/g,'$1.$2');
  const url=URL.createObjectURL(new Blob([t],{type:'text/vtt'}));
  V.querySelectorAll('track').forEach(x=>x.remove());
  const tr=document.createElement('track');tr.kind='subtitles';tr.label=f.name.replace(/\.\w+$/,'');tr.srclang='pt';tr.src=url;tr.default=true;V.appendChild(tr);
  tr.track.mode='showing';setBuild();
};
$('#psbtn').onclick=()=>{const P=$('#pset');if(!P.classList.contains('hide')){P.classList.add('hide');return}$('#plist').classList.add('hide');$('#pepg').classList.add('hide');setBuild();P.classList.remove('hide')};

$('#ppip').onclick=()=>{if(document.pictureInPictureElement)document.exitPictureInPicture();else if(V.requestPictureInPicture)V.requestPictureInPicture().catch(()=>{})};
V.addEventListener('dblclick',e=>{
  e.preventDefault();const r=V.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
  if(!playCtx?.live&&x<.33)seekBy(-10);
  else if(!playCtx?.live&&x>.67)seekBy(10);
  else toggleFS();
});

/* ---------- controles que somem sozinhos (em tela cheia: bem rápido e tela limpa) ---------- */
let idleT=0,lastMX=-99,lastMY=-99;
const idleMs=()=>FSE()?1500:3500;
function setIdle(on){$('#player').classList.toggle('idle',on);V.controls=!on&&!(playCtx&&(playCtx.live||playCtx.tc))}
function wake(){
  setIdle(false);clearTimeout(idleT);
  if(!$('#player').classList.contains('hide')&&!V.paused)idleT=setTimeout(()=>{if(!panelsOpen()&&!V.paused)setIdle(true)},idleMs());
}
$('#player').addEventListener('mousemove',e=>{if(Math.abs(e.clientX-lastMX)+Math.abs(e.clientY-lastMY)>6){lastMX=e.clientX;lastMY=e.clientY;wake()}},{passive:true});
['touchstart','click'].forEach(ev=>$('#player').addEventListener(ev,wake,{passive:true}));
document.addEventListener('keydown',()=>{if(!$('#player').classList.contains('hide'))wake()});
V.addEventListener('pause',wake);V.addEventListener('playing',wake);
// ao entrar em tela cheia com o vídeo rodando: limpa a tela na hora
document.addEventListener('fullscreenchange',()=>{
  const open=!$('#player').classList.contains('hide');
  if(FSE()&&open&&!V.paused&&!panelsOpen())setTimeout(()=>setIdle(true),400);else if(open)wake();
});

/* ---------- tela sempre ligada + controles do sistema ---------- */
let wl=null;
async function wlOn(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch{}}
function wlOff(){try{wl&&wl.release()}catch{}wl=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&playCtx)wlOn()});
function mediaInfo(ctx){
  if(!('mediaSession' in navigator))return;
  try{const ms=navigator.mediaSession;
    ms.metadata=new MediaMetadata({title:ctx.title,artist:'IPTV PREMIUM',artwork:ctx.it.img?[{src:ctx.it.img}]:[]});
    ms.setActionHandler('play',()=>V.play());ms.setActionHandler('pause',()=>V.pause());
    ms.setActionHandler('previoustrack',ctx.prev||null);ms.setActionHandler('nexttrack',ctx.next||null);
    ms.setActionHandler('seekbackward',ctx.live?null:()=>seekBy(-10));
    ms.setActionHandler('seekforward',ctx.live?null:()=>seekBy(10));
  }catch{}
}

/* ---------- canal ao vivo travou? reconecta sozinho ---------- */
setInterval(()=>{
  if(!playCtx||!playCtx.live||$('#player').classList.contains('hide')||V.paused)return;
  if(V.currentTime===wd.last)wd.n++;else{wd.n=0;wd.last=V.currentTime}
  if(wd.n>=4){wd.n=0;
    if(wd.tries<6){wd.tries++;$('#perr').textContent='Reconectando…';play({...playCtx})}
    else $('#perr').textContent='Canal sem sinal. Tente outro canal.';}
},3000);
V.addEventListener('playing',()=>{if(isTc())$('#perr').textContent='';if(['Reconectando…',tr('Reconectando…')].includes($('#perr').textContent))$('#perr').textContent='';clearTimeout(wd.rt);wd.rt=setTimeout(()=>{wd.tries=0},30000)});

/* ---------- teclado / controle remoto (setas, OK, voltar) ---------- */
const isBack=e=>e.key==='Escape'||e.key==='GoBack'||e.key==='BrowserBack'||e.keyCode===10009||e.keyCode===461||e.keyCode===4;
function spatial(dir){
  const modalOpen=!$('#modal').classList.contains('hide'),playerOpen=!$('#player').classList.contains('hide');
  const scope=modalOpen?$('#modal'):playerOpen?document.querySelector('#plist:not(.hide),#pepg:not(.hide),#pset:not(.hide)'):document.body;
  if(!scope)return false;
  const els=[...scope.querySelectorAll('button:not([disabled]),select,input:not([type=file]),[tabindex="0"]')].filter(el=>!el.classList.contains('star')&&el.getClientRects().length&&!el.closest('.hide')&&getComputedStyle(el).visibility!=='hidden');
  if(!els.length)return false;
  let cur=document.activeElement;
  if(!els.includes(cur)){const f=els.find(x=>x.matches('#nav button.on'))||els[0];f.focus();return true}
  const c=r=>({x:r.left+r.width/2,y:r.top+r.height/2});
  const a=cur.getBoundingClientRect(),ca=c(a);let best=null,bs=1e9;
  for(const el of els){if(el===cur)continue;const r=el.getBoundingClientRect(),cc=c(r),dx=cc.x-ca.x,dy=cc.y-ca.y;
    let pri,sec;
    if(dir==='right'&&dx>2){pri=dx;sec=Math.abs(dy)}
    else if(dir==='left'&&dx<-2){pri=-dx;sec=Math.abs(dy)}
    else if(dir==='down'&&dy>2){pri=dy;sec=Math.abs(dx)}
    else if(dir==='up'&&dy<-2){pri=-dy;sec=Math.abs(dx)}
    else continue;
    const sc=pri+sec*2.5;if(sc<bs){bs=sc;best=el}}
  if(best){best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'});return true}
  return false;
}
document.addEventListener('keydown',e=>{
  const k=e.key,tag=e.target.tagName,typing=/INPUT|TEXTAREA/.test(tag);
  const tv=document.body.classList.contains('tv');
  const modalOpen=!$('#modal').classList.contains('hide'),playerOpen=!$('#player').classList.contains('hide');
  // voltar
  if(isBack(e)||(k==='Backspace'&&!typing)){
    if(modalOpen){hideModal();e.preventDefault();return}
    if(playerOpen){if(panelsOpen())closePanels();else closePlayer();e.preventDefault();return}
    return;
  }
  if(typing&&!(tv&&(k==='ArrowDown'||k==='ArrowUp')))return;
  if(tag==='SELECT')return;
  const arrows=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  if(playerOpen&&!modalOpen){
    if(k==='l'||k==='L'){plToggle();return}
    if((k==='g'||k==='G')&&playCtx?.live&&acc.mode==='x'){epgToggle();return}
    if(k==='s'||k==='S'){$('#psbtn').click();return}
    if(k==='d'||k==='D'){$('#pfav').click();return}
    if(k==='a'||k==='A'){fitNext();return}
    if(k==='f'||k==='F'){toggleFS();return}
    if(!panelsOpen()){
      const live=!!playCtx?.live;
      if(k===' '||k==='k'||k==='MediaPlayPause'||(k==='Enter'&&!live&&tag!=='BUTTON')){e.preventDefault();V.paused?V.play():V.pause();return}
      if(k==='Enter'&&live&&tag!=='BUTTON'){plToggle();return}
      if(k==='ArrowUp'||k==='ChannelUp'||k==='PageUp'||k==='MediaTrackPrevious'){e.preventDefault();if(live)playCtx.prev&&playCtx.prev();else if(k==='ArrowUp')V.volume=Math.min(1,V.volume+.1);return}
      if(k==='ArrowDown'||k==='ChannelDown'||k==='PageDown'||k==='MediaTrackNext'){e.preventDefault();if(live)playCtx.next&&playCtx.next();else if(k==='ArrowDown')V.volume=Math.max(0,V.volume-.1);return}
      if(k==='ArrowRight'&&!live){e.preventDefault();seekBy(e.shiftKey?60:10);return}
      if(k==='ArrowLeft'&&!live){e.preventDefault();seekBy(-(e.shiftKey?60:10));return}
      if(k==='ArrowLeft'&&live&&tv){plToggle();return}
      if(k==='m'||k==='M'){V.muted=!V.muted;return}
      return;
    }
  }
  if(arrows.includes(k)){
    const use=tv||(document.activeElement&&document.activeElement!==document.body)||modalOpen;
    if(use&&spatial(k.slice(5).toLowerCase()))e.preventDefault();
  }
});
